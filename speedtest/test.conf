# 用于直接连接测试的链接（Hetzner 测速文件）
download-url = https://sin-speed.hetzner.com/10GB.bin

# 用于代理连接测试的链接（Apple CDN 测速，对代理节点更友好）
download-url-proxy = https://mensura.cdn-apple.com/api/v1/gm/large

# 上传测试（保持默认或填入你的服务器上传 API，如果没有通常保持留空或注释）
# upload-url = 
# upload-url-proxy = 

# 性能参数微调
# 增加并发数可以更好地榨干千兆带宽，设置为 8-10 比较理想
download-concurrency = 10
upload-concurrency = 10

# 测试时长限制，建议 10-15 秒，避免流量消耗过快
download-duration-limit = 10
upload-duration-limit = 10

# 上传大小限制
upload-size-limit = 1024
